server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 显式声明响应字符集：nginx 默认 charset off，静态 html/js 的 Content-Type
    # 不带 charset，浏览器只能靠系统 locale 猜。虽然 index.html 自带 meta UTF-8
    # 能兜住，但直接下载/预览 .json、.txt、.md 之类的静态文件时仍会显示乱码。
    charset utf-8;

    # 放开请求体上限：评分文书 PDF（base64）随保存接口提交，单页约 1MB，默认 1m 会 413 导致保存一直转圈/失败
    client_max_body_size 20m;
    client_body_timeout 120s;

    # API 转发到后端
    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大字段（PDF base64）写入与回传需要更长的读写超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 质控下钻接口：这两条是全站唯一「按需物化事实层」的读接口 ——
    # 所查月份若尚未被预热，服务端要现场建事实层表（实测约 96 张、106 秒），
    # 恰好压在 /api/ 的 120s 读超时边缘，于是表现为时好时坏的 504。
    # 这里单独放宽到 5 分钟，与前端 fetchQualityPatientMetrics 的 300s 超时对齐。
    # 注意：只是兜底，正常路径由启动预热（zing.quality.warmup-on-startup）保证百毫秒级。
    location /api/quality/patient/ {
        proxy_pass http://backend:8081/api/quality/patient/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /api/quality/metric/patients {
        proxy_pass http://backend:8081/api/quality/metric/patients;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 外链统一入口转发到后端
    location /entry/ {
        proxy_pass http://backend:8081/entry/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 禁止缓存：每次都拿到引用最新 hash chunk 的 index.html，
    # 避免发版后外层 iframe / 浏览器仍用缓存的旧入口、继续跑旧 JS（本次“更新后仍是旧效果”的根因）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # 带内容 hash 的静态资源：文件名随内容变化，可安全长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
