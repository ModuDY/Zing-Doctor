# =====================================================================
# 事实层（DWD）· 患者流转 + 评分/资源
#
# 本文件是「与手写 SQL 建中间表」的关键区别：事实层由 DSL 声明，
# 引擎编译成 SQL 并物化为物理表（quality_fact_*_yyyyMMdd），同域指标共享一次扫描。
#
# 约定：
#   · :periodStart / :periodEnd 由引擎按周期注入，配置里直接当常量用；
#   · derive 里的列名就是物化后的列名，指标通过 where/numerator 引用它们；
#   · 常数比较不用 CAST 数字，避免达梦对非数字串隐式转换报错。
#   · 引用大字段（CLOB/TEXT）必须显式 CAST 成 VARCHAR，例如
#       - "CAST(pi.diagnosis_content AS VARCHAR(2000)) AS diagnosis_content"
#     原因：事实层是 CREATE TABLE AS SELECT 物化成物理表的，之后指标若把它配成
#     患者明细补充列，引擎会统一套 MAX(...) 聚合（SqlCompiler.compilePatients）；
#     达梦不允许对 CLOB 做 MAX / GROUP BY，原样写列名会在计算阶段报错，
#     而报错信息只说「聚合」之类，很难联想到是这里少了一层 CAST。
#     项目里凡是查 diagnosis_content 的地方都套了 CAST，见 IcuPatientMapper。
# =====================================================================

# ---------------------------------------------------------------------
# 患者流转：ICU 患者主表
# 床日口径：取「本周期」与「实际在院区间」的交集，跨月自动切分，
#           因此同一患者的床日会按月分摊，而不是整段记在入院月。
# ---------------------------------------------------------------------
- fact: fact_patient_stay
  domain: 患者流转
  status: ACTIVE
  source: patient_info
  alias: pi
  # 科室列（物化后的列名）。明细的「科室」列、以及「只算某科室」都依赖它：
  # 漏声明时明细科室列会整列显示为空，且科室维度无法单独计算（已踩过）。
  departKey: depart_code
  note: ICU 患者主表；床日按「本周期 ∩ 在院区间」取交集，跨月自动切分
  select:
    - "pi.id AS patient_id"
    - "pi.in_hospital_no AS in_hospital_no"
    - "pi.name AS patient_name"
    - "pi.gender AS gender"
    - "pi.age AS age"
    - "pi.depart_code AS depart_code"
    - "pi.ward_name AS ward_name"
    - "pi.out_vest_type AS out_vest_type"
    - "pi.charge_doctor_name AS charge_doctor_name"
    - "pi.in_depart_time AS in_depart_time"
    - "pi.out_depart_time AS out_depart_time"
    - "pi.out_hospital_time AS out_hospital_time"
    # 患者明细的默认列「床号 / 诊断」直接取自患者主表。
    # 这两列不参与任何指标表达式，只为让明细里那两列有值 —— 明细 SQL 只 select
    # 事实层投影过的列，不在这里带出来，页面上就只能是空白。
    # 诊断必须套 CAST：事实层是 CREATE TABLE AS SELECT 物化成物理表的，
    # 而明细会统一套 MAX(...)，达梦不允许对 CLOB 做 MAX（本文件开头已记过这条坑）。
    - "pi.bed_code AS bed_code"
    - "CAST(pi.diagnosis_content AS VARCHAR(2000)) AS diagnosis_content"
  where:
    - "pi.del_flag = 0"
    - "pi.in_depart_time IS NOT NULL"
    - "pi.in_depart_time < :periodEnd"
    - "(pi.out_depart_time IS NULL OR pi.out_depart_time >= :periodStart)"
  derive:
    # 本周期内入院/转入
    - "CASE WHEN pi.in_depart_time >= :periodStart THEN 1 ELSE 0 END AS admitted_in_period"
    # 本周期内转出/出院（转科、出院、死亡、临终、自动转院均算离开 ICU）
    - "CASE WHEN pi.out_depart_time >= :periodStart AND pi.out_depart_time < :periodEnd THEN 1 ELSE 0 END AS out_in_period"
    # 死亡：out_vest_type=3（字典：1转科 2出院 3死亡 4临终 5自动转院）
    - "CASE WHEN pi.out_vest_type = 3 THEN 1 ELSE 0 END AS died"
    - "CASE WHEN pi.out_vest_type = 3 AND pi.out_depart_time >= :periodStart AND pi.out_depart_time < :periodEnd THEN 1 ELSE 0 END AS died_in_period"
    # 存活转出（分母用：转出 + 出院，排除死亡）
    - "CASE WHEN (pi.out_vest_type IS NULL OR pi.out_vest_type <> 3) AND pi.out_depart_time >= :periodStart AND pi.out_depart_time < :periodEnd THEN 1 ELSE 0 END AS survived_out_in_period"
    # 床日数：本周期与在院区间的交集天数（跨月切分的实现点）
    - "DATEDIFF(DAY, CASE WHEN pi.in_depart_time < :periodStart THEN :periodStart ELSE pi.in_depart_time END, CASE WHEN (pi.out_depart_time IS NULL OR pi.out_depart_time > :periodEnd) THEN :periodEnd ELSE pi.out_depart_time END) AS stay_days"
    # 术后转入：诊断文本含「术后」。非计划标识（手术计划状态）当前无源，见 quality_20 说明
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_info_diagnosis\" d WHERE d.patient_id = pi.id AND d.del_flag = 0 AND d.status = 1 AND (d.diag_name LIKE '%术后%' OR d.diag_name LIKE '%手术后%')) THEN 1 ELSE 0 END AS post_op"
    # 48h 内重返 ICU：同一住院号下存在更早的一次转出，且与本转入间隔 <= 48h
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_info\" p2 WHERE p2.in_hospital_no = pi.in_hospital_no AND p2.id <> pi.id AND p2.del_flag = 0 AND p2.out_depart_time IS NOT NULL AND p2.out_depart_time < pi.in_depart_time AND DATEDIFF(HOUR, p2.out_depart_time, pi.in_depart_time) <= 48) THEN 1 ELSE 0 END AS readmit_48h"

# ---------------------------------------------------------------------
# 评分/资源：APACHE II 评分记录（医生库）
# 预计病死率取 mortality_rate 的**求和**（各患者预计死亡率之和）。
# 指标层 quality_15 用 agg=SUM + valueType=SUM 原样输出该和值，
# 由 ICU 侧规则「÷ 同期人数 × 系数」得出病死率 —— 本层不参与除法。
# ---------------------------------------------------------------------
- fact: fact_score_resource
  domain: 评分_资源
  status: ACTIVE
  source: patient_doc_apache2_score_record
  alias: a
  departKey: depart_code
  note: APACHE II 评分记录；预计病死率取 mortality_rate 均值
  select:
    - "a.patient_id AS patient_id"
    - "a.in_hospital_no AS in_hospital_no"
    - "a.patient_name AS patient_name"
    - "a.depart_code AS depart_code"
    - "a.total_score AS total_score"
    - "a.mortality_rate AS mortality_rate"
    - "a.score_time AS score_time"
    - "a.score_type AS score_type"
  where:
    - "a.status = 1"
    - "a.score_time >= :periodStart"
    - "a.score_time < :periodEnd"
  derive:
    - "CASE WHEN a.total_score >= 15 THEN 1 ELSE 0 END AS apache_ge15"

# ---------------------------------------------------------------------
# ICU 医护人员（fact_staff）—— 已连库激活（2026-10-15）
# 注意 patientKey=user_id：资源类指标的计数对象是「人」，不是患者。
# 实库核实：config_staff 有数据（全院 3691 人，ICU 相关科室约 150 人）；
# icu_nurse_working_schedule / icu_doctor_working_schedule 均为 0 行（排班功能未启用），
# 因此「在岗」无法按班次过滤，以人员档案所在科室近似官方口径
# （2024版 ICU-02：全职从事 ICU 工作的执业医师 / 注册护士）。
# 科室筛选：depart_name 含 ICU 或「重症」，但排除「呼吸与危重症医学科」
# （该名称含"重症医学科"子串但不是 ICU）。
# ---------------------------------------------------------------------
- fact: fact_staff
  domain: 评分_资源
  status: ACTIVE
  source: config_staff
  alias: s
  patientKey: user_id
  inHospitalNoKey: work_no
  patientNameKey: realname
  departKey: depart_code
  note: ICU 医护人员花名册（config_staff）；排班表未启用，以档案科室近似全职口径
  select:
    - "s.id AS user_id"
    - "s.realname AS realname"
    - "s.work_no AS work_no"
    - "s.depart_code AS depart_code"
    - "s.depart_name AS depart_name"
    - "s.post_name AS post_name"
    - "s.office_date AS office_date"
    - "s.leave_date AS leave_date"
  where:
    - "s.del_flag = 0"
    - "s.leave_date IS NULL"
    - "(s.depart_name LIKE '%ICU%' OR (s.depart_name LIKE '%重症%' AND s.depart_name NOT LIKE '%呼吸与危重症%'))"
  derive:
    - "CASE WHEN s.post_name LIKE '%医师%' THEN 1 ELSE 0 END AS is_doctor"
    - "CASE WHEN s.post_name LIKE '%护士%' OR s.post_name LIKE '%护师%' THEN 1 ELSE 0 END AS is_nurse"

# ---------------------------------------------------------------------
# 床位开放记录（fact_bed）
# 字段与 DB 种子（sql/40_qc_fact_def_seed.sql，2026-09-17 已置 ACTIVE）保持一致：
#   bed_id / bed_code / bed_name / depart_code / begin_use_time / stop_use_time。
# bed_days 按「本周期 ∩ 开放区间」切分，与 fact_patient_stay.stay_days 同构，
# 因此「床位使用率 = 占用总床日 ÷ 开放总床日」两条腿同一把尺子。
# ---------------------------------------------------------------------
- fact: fact_bed
  domain: 床位_资源
  status: ACTIVE
  source: config_bed
  alias: b
  patientKey: bed_id
  inHospitalNoKey: ""
  patientNameKey: ""
  departKey: depart_code
  note: 床位开放记录（config_bed）；支撑床位使用率/医师床位比/护士床位比分母
  select:
    - "b.id AS bed_id"
    - "b.bed_code AS bed_code"
    - "b.bed_name AS bed_name"
    - "b.depart_code AS depart_code"
    - "b.begin_use_time AS begin_use_time"
    - "b.stop_use_time AS stop_use_time"
  where:
    - "b.del_flag = 0"
  derive:
    - "CASE WHEN b.begin_use_time IS NULL OR b.begin_use_time > :periodEnd THEN :periodEnd ELSE b.begin_use_time END AS open_to"
    - "DATEDIFF(DAY, CASE WHEN b.begin_use_time < :periodStart THEN :periodStart ELSE b.begin_use_time END, CASE WHEN (b.stop_use_time IS NULL OR b.stop_use_time > :periodEnd) THEN :periodEnd ELSE b.stop_use_time END) AS bed_days"
    - "CASE WHEN (b.begin_use_time IS NULL OR b.begin_use_time < :periodEnd) AND (b.stop_use_time IS NULL OR b.stop_use_time >= :periodStart) THEN 1 ELSE 0 END AS open_in_period"
