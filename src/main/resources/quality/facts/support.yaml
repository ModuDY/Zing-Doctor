# =====================================================================
# 事实层（DWD）· 抗菌药送检 / DVT 预防 / 管路导管
#
# 本文件集中承载「待接数据源」的事实层。待接的事实层照旧完整声明，
# 只是 status=PENDING_SOURCE：引擎不会编译它，页面会明确显示「待接数据源」，
# 而不是给出一个看起来像真数据的 0 —— 这是与老系统「空壳脚本返回 0」的关键差别。
# =====================================================================

# ---------------------------------------------------------------------
# 抗菌药送检
# 关键设计：把「首次抗菌药医嘱时间」与「首次病原学送检时间」各算一次、
# 落成两个时间列，比较交给指标层的 where。
# 好处：时间比较这条口径只写一次，quality_12/13 直接复用；
# PCT / G 试验 / 白介素 的首检时间列一并备好，供 quality_427~432 接入「治疗性」标识后启用。
# ---------------------------------------------------------------------
- fact: fact_abx_culture
  domain: 抗菌药送检
  status: ACTIVE
  source: patient_info
  alias: pi
  note: 首次抗菌药使用时间与首次各类病原学送检时间（比较口径在指标层）
  select:
    - "pi.id AS patient_id"
    - "pi.in_hospital_no AS in_hospital_no"
    - "pi.name AS patient_name"
    - "pi.depart_code AS depart_code"
    - "pi.in_depart_time AS in_depart_time"
    - "pi.out_depart_time AS out_depart_time"
    # 明细默认列（床号 / 诊断）取自患者主表，不参与指标表达式；
    # 诊断套 CAST 的原因见 patient.yaml 文件头（CLOB 不能做 MAX）
    - "pi.bed_code AS bed_code"
    - "CAST(pi.diagnosis_content AS VARCHAR(2000)) AS diagnosis_content"
  where:
    - "pi.del_flag = 0"
    - "pi.in_depart_time IS NOT NULL"
    - "pi.in_depart_time < :periodEnd"
    - "(pi.out_depart_time IS NULL OR pi.out_depart_time >= :periodStart)"
  derive:
    # 是否使用过抗菌药物（医嘱 type_code='drug' + 药名词表）
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice\" pa WHERE pa.in_hospital_no = pi.in_hospital_no AND pa.del_flag = 0 AND pa.status = '1' AND pa.type_code = 'drug' AND (pa.name LIKE '%头孢%' OR pa.name LIKE '%培南%' OR pa.name LIKE '%万古霉素%' OR pa.name LIKE '%利奈唑胺%' OR pa.name LIKE '%替考拉宁%' OR pa.name LIKE '%达托霉素%' OR pa.name LIKE '%左氧氟沙星%' OR pa.name LIKE '%莫西沙星%' OR pa.name LIKE '%环丙沙星%' OR pa.name LIKE '%阿奇霉素%' OR pa.name LIKE '%阿米卡星%' OR pa.name LIKE '%庆大霉素%' OR pa.name LIKE '%替加环素%' OR pa.name LIKE '%多黏菌素%' OR pa.name LIKE '%氟康唑%' OR pa.name LIKE '%伏立康唑%' OR pa.name LIKE '%卡泊芬净%' OR pa.name LIKE '%米卡芬净%' OR pa.name LIKE '%甲硝唑%' OR pa.name LIKE '%青霉素%' OR pa.name LIKE '%阿莫西林%' OR pa.name LIKE '%氨苄西林%' OR pa.name LIKE '%哌拉西林%' OR pa.name LIKE '%氨曲南%' OR pa.name LIKE '%磷霉素%' OR pa.name LIKE '%利福平%' OR pa.name LIKE '%磺胺%' OR pa.name LIKE '%新诺明%')) THEN 1 ELSE 0 END AS abx_used"
    # 首次抗菌药开始时间（无则 NULL，比较时自动排除）
    - "(SELECT MIN(pa.start_time) FROM \"zing_icu_db_prod\".\"patient_advice\" pa WHERE pa.in_hospital_no = pi.in_hospital_no AND pa.del_flag = 0 AND pa.status = '1' AND pa.type_code = 'drug' AND pa.start_time IS NOT NULL AND (pa.name LIKE '%头孢%' OR pa.name LIKE '%培南%' OR pa.name LIKE '%万古霉素%' OR pa.name LIKE '%利奈唑胺%' OR pa.name LIKE '%替考拉宁%' OR pa.name LIKE '%达托霉素%' OR pa.name LIKE '%左氧氟沙星%' OR pa.name LIKE '%莫西沙星%' OR pa.name LIKE '%环丙沙星%' OR pa.name LIKE '%阿奇霉素%' OR pa.name LIKE '%阿米卡星%' OR pa.name LIKE '%庆大霉素%' OR pa.name LIKE '%替加环素%' OR pa.name LIKE '%多黏菌素%' OR pa.name LIKE '%氟康唑%' OR pa.name LIKE '%伏立康唑%' OR pa.name LIKE '%卡泊芬净%' OR pa.name LIKE '%米卡芬净%' OR pa.name LIKE '%甲硝唑%' OR pa.name LIKE '%青霉素%' OR pa.name LIKE '%阿莫西林%' OR pa.name LIKE '%氨苄西林%' OR pa.name LIKE '%哌拉西林%' OR pa.name LIKE '%氨曲南%' OR pa.name LIKE '%磷霉素%' OR pa.name LIKE '%利福平%' OR pa.name LIKE '%磺胺%' OR pa.name LIKE '%新诺明%')) AS abx_first_time"
    # 首次病原学标本（培养）送检时间
    - "(SELECT MIN(li.check_time) FROM \"zing_icu_db_prod\".\"patient_info_lis_item\" li WHERE li.in_hospital_no = pi.in_hospital_no AND li.del_flag = 0 AND li.check_time IS NOT NULL AND (li.lis_item_name LIKE '%培养%' OR li.lis_item_name LIKE '%涂片%' OR li.lis_item_name LIKE '%镜检%' OR li.lis_item_name LIKE '%药敏%' OR li.lis_item_name LIKE '%鉴定%')) AS culture_first_time"
    # 首次 PCT / G 试验/GM 试验 / 白介素 送检时间（备 quality_427~432 接入治疗性标识后使用）
    - "(SELECT MIN(li.check_time) FROM \"zing_icu_db_prod\".\"patient_info_lis_item\" li WHERE li.in_hospital_no = pi.in_hospital_no AND li.del_flag = 0 AND li.check_time IS NOT NULL AND li.lis_item_name LIKE '%降钙素原%') AS pct_first_time"
    - "(SELECT MIN(li.check_time) FROM \"zing_icu_db_prod\".\"patient_info_lis_item\" li WHERE li.in_hospital_no = pi.in_hospital_no AND li.del_flag = 0 AND li.check_time IS NOT NULL AND (li.lis_item_name LIKE '%G试验%' OR li.lis_item_name LIKE '%GM试验%' OR li.lis_item_name LIKE '%半乳甘露聚糖%' OR li.lis_item_name LIKE '%1,3-β-D葡聚糖%')) AS ggm_first_time"
    - "(SELECT MIN(li.check_time) FROM \"zing_icu_db_prod\".\"patient_info_lis_item\" li WHERE li.in_hospital_no = pi.in_hospital_no AND li.del_flag = 0 AND li.check_time IS NOT NULL AND (li.lis_item_name LIKE '%白介素%' OR li.lis_item_name LIKE '%IL-6%' OR li.lis_item_name LIKE '%IL6%')) AS il6_first_time"

# ---------------------------------------------------------------------
# DVT 预防
# 诊断侧：DVT 诊断、DVT 相关死亡（patient_info_diagnosis + 转归）。
# 预防侧：药物预防 / 机械预防 / 下腔静脉滤器，取数列与 DB 种子
#         （sql/40_qc_fact_def_seed.sql）保持一致，关键词按
#         《重症医学专业医疗质量控制指标（2024 年版）》ICU-07 官方口径扩充：
#           药物预防 = 肝素或低分子肝素等抗凝药物，如依诺肝素、那曲肝素以及利伐沙班等口服抗凝剂；
#           机械预防 = 肢体加压泵、梯度压力弹力袜等；
#           滤器     = 下腔静脉滤器。
# 源表（已连库核实 2026-10-15）：
#   药物预防 = patient_advice_execute_drug（无时间列）JOIN patient_advice_execute
#              取执行起止（start_time 99%有值），按「执行区间∩本周期」过滤；
#   机械/滤器 = patient_advice_original（自带 start_time/end_time），同法过滤。
# 注意：源库 is_dvt 标记为医嘱组级（普通补液也带），不可用作预防判定，故按
#       2024版 ICU-07 官方药物/措施关键词识别。
# ---------------------------------------------------------------------
- fact: fact_dvt
  domain: DVT预防
  status: ACTIVE
  source: patient_info
  alias: pi
  note: DVT 诊断/死亡 + 药物/机械/滤器预防（医嘱侧，2024版ICU-07口径）
  select:
    - "pi.id AS patient_id"
    - "pi.in_hospital_no AS in_hospital_no"
    - "pi.name AS patient_name"
    - "pi.gender AS gender"
    - "pi.bed_code AS bed_code"
    - "pi.age AS age"
    - "pi.depart_code AS depart_code"
    - "pi.ward_name AS ward_name"
    - "pi.out_vest_type AS out_vest_type"
    - "pi.charge_doctor_name AS charge_doctor_name"
    - "pi.in_depart_time AS in_depart_time"
    - "pi.out_depart_time AS out_depart_time"
    - "pi.out_hospital_time AS out_hospital_time"
    # 明细默认列（床号 / 诊断）取自患者主表，不参与指标表达式；
    # 诊断套 CAST 的原因见 patient.yaml 文件头（CLOB 不能做 MAX）
    - "CAST(pi.diagnosis_content AS VARCHAR(2000)) AS diagnosis_content"
  where:
    - "pi.del_flag = 0"
    - "pi.in_depart_time IS NOT NULL"
    - "pi.in_depart_time < :periodEnd"
    - "(pi.out_depart_time IS NULL OR pi.out_depart_time >= :periodStart)"
  derive:
    # ---- 诊断侧 ----
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_info_diagnosis\" d WHERE d.patient_id = pi.id AND d.del_flag = 0 AND d.status = 1 AND (d.diag_name LIKE '%深静脉血栓%' OR d.diag_name LIKE '%下肢静脉血栓%' OR d.diag_name LIKE '%肺栓塞%')) THEN 1 ELSE 0 END AS dvt_diag"
    - "CASE WHEN pi.out_vest_type = 3 AND EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_info_diagnosis\" d WHERE d.patient_id = pi.id AND d.del_flag = 0 AND d.status = 1 AND (d.diag_name LIKE '%深静脉血栓%' OR d.diag_name LIKE '%下肢静脉血栓%' OR d.diag_name LIKE '%肺栓塞%')) THEN 1 ELSE 0 END AS dvt_death"
    - "CASE WHEN pi.out_vest_type = 3 AND pi.out_depart_time >= :periodStart AND pi.out_depart_time < :periodEnd THEN 1 ELSE 0 END AS died_in_period"
    - "CASE WHEN pi.out_depart_time >= :periodStart AND pi.out_depart_time < :periodEnd THEN 1 ELSE 0 END AS out_in_period"
    # ---- 预防侧：药物（执行医嘱药品表；肝素覆盖低分子/依诺/那曲肝素）----
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_execute_drug\" e JOIN \"zing_icu_db_prod\".\"patient_advice_execute\" x ON x.id = e.execute_id WHERE e.patient_id = pi.id AND e.del_flag = 0 AND x.del_flag = 0 AND x.start_time < :periodEnd AND (x.end_time IS NULL OR x.end_time >= :periodStart) AND (e.drug_name LIKE '%肝素%' OR e.drug_name LIKE '%利伐沙班%' OR e.drug_name LIKE '%达比加群酯%' OR e.drug_name LIKE '%阿哌沙班%' OR e.drug_name LIKE '%磺达肝癸%')) THEN 1 ELSE 0 END AS dvt_drug_status"
    # ---- 预防侧：机械（原始医嘱；肢体加压泵/梯度压力弹力袜等）----
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_original\" o WHERE o.in_hospital_serial_no = pi.in_hospital_serial_no AND o.start_time < :periodEnd AND (o.end_time IS NULL OR o.end_time >= :periodStart) AND (o.advice_name LIKE '%气压治疗%' OR o.advice_name LIKE '%肢体加压%' OR o.advice_name LIKE '%间歇充气%' OR o.advice_name LIKE '%加压泵%' OR o.advice_name LIKE '%空气波%' OR o.advice_name LIKE '%梯度压力%' OR o.advice_name LIKE '%抗血栓%' OR o.advice_name LIKE '%弹力袜%')) THEN 1 ELSE 0 END AS dvt_mech_status"
    # ---- 预防侧：下腔静脉滤器（原始医嘱）----
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_original\" o WHERE o.in_hospital_serial_no = pi.in_hospital_serial_no AND o.start_time < :periodEnd AND (o.end_time IS NULL OR o.end_time >= :periodStart) AND (o.advice_name LIKE '%下腔静脉滤器%' OR o.advice_name LIKE '%滤器置入%')) THEN 1 ELSE 0 END AS dvt_filter_status"
    # ---- 组合列：任一预防 / 仅某一类 ----
    # 注意：同一 SELECT 列表里不能引用其它输出列的别名（达梦会报无效列名），
    # 因此组合列把三类 EXISTS 完整内联，关键词与上面三列保持一致。
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_execute_drug\" e JOIN \"zing_icu_db_prod\".\"patient_advice_execute\" x ON x.id = e.execute_id WHERE e.patient_id = pi.id AND e.del_flag = 0 AND x.del_flag = 0 AND x.start_time < :periodEnd AND (x.end_time IS NULL OR x.end_time >= :periodStart) AND (e.drug_name LIKE '%肝素%' OR e.drug_name LIKE '%利伐沙班%' OR e.drug_name LIKE '%达比加群酯%' OR e.drug_name LIKE '%阿哌沙班%' OR e.drug_name LIKE '%磺达肝癸%')) OR EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_original\" o WHERE o.in_hospital_serial_no = pi.in_hospital_serial_no AND o.start_time < :periodEnd AND (o.end_time IS NULL OR o.end_time >= :periodStart) AND (o.advice_name LIKE '%气压治疗%' OR o.advice_name LIKE '%肢体加压%' OR o.advice_name LIKE '%间歇充气%' OR o.advice_name LIKE '%加压泵%' OR o.advice_name LIKE '%空气波%' OR o.advice_name LIKE '%梯度压力%' OR o.advice_name LIKE '%抗血栓%' OR o.advice_name LIKE '%弹力袜%')) OR EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_original\" o WHERE o.in_hospital_serial_no = pi.in_hospital_serial_no AND o.start_time < :periodEnd AND (o.end_time IS NULL OR o.end_time >= :periodStart) AND (o.advice_name LIKE '%下腔静脉滤器%' OR o.advice_name LIKE '%滤器置入%')) THEN 1 ELSE 0 END AS dvt_prevent_status"
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_execute_drug\" e JOIN \"zing_icu_db_prod\".\"patient_advice_execute\" x ON x.id = e.execute_id WHERE e.patient_id = pi.id AND e.del_flag = 0 AND x.del_flag = 0 AND x.start_time < :periodEnd AND (x.end_time IS NULL OR x.end_time >= :periodStart) AND (e.drug_name LIKE '%肝素%' OR e.drug_name LIKE '%利伐沙班%' OR e.drug_name LIKE '%达比加群酯%' OR e.drug_name LIKE '%阿哌沙班%' OR e.drug_name LIKE '%磺达肝癸%')) AND NOT EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_original\" o WHERE o.in_hospital_serial_no = pi.in_hospital_serial_no AND o.start_time < :periodEnd AND (o.end_time IS NULL OR o.end_time >= :periodStart) AND (o.advice_name LIKE '%气压治疗%' OR o.advice_name LIKE '%肢体加压%' OR o.advice_name LIKE '%间歇充气%' OR o.advice_name LIKE '%加压泵%' OR o.advice_name LIKE '%空气波%' OR o.advice_name LIKE '%梯度压力%' OR o.advice_name LIKE '%抗血栓%' OR o.advice_name LIKE '%弹力袜%' OR o.advice_name LIKE '%下腔静脉滤器%' OR o.advice_name LIKE '%滤器置入%')) THEN 1 ELSE 0 END AS dvt_only_drug"
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_original\" o WHERE o.in_hospital_serial_no = pi.in_hospital_serial_no AND o.start_time < :periodEnd AND (o.end_time IS NULL OR o.end_time >= :periodStart) AND (o.advice_name LIKE '%气压治疗%' OR o.advice_name LIKE '%肢体加压%' OR o.advice_name LIKE '%间歇充气%' OR o.advice_name LIKE '%加压泵%' OR o.advice_name LIKE '%空气波%' OR o.advice_name LIKE '%梯度压力%' OR o.advice_name LIKE '%抗血栓%' OR o.advice_name LIKE '%弹力袜%')) AND NOT EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_execute_drug\" e JOIN \"zing_icu_db_prod\".\"patient_advice_execute\" x ON x.id = e.execute_id WHERE e.patient_id = pi.id AND e.del_flag = 0 AND x.del_flag = 0 AND x.start_time < :periodEnd AND (x.end_time IS NULL OR x.end_time >= :periodStart) AND (e.drug_name LIKE '%肝素%' OR e.drug_name LIKE '%利伐沙班%' OR e.drug_name LIKE '%达比加群酯%' OR e.drug_name LIKE '%阿哌沙班%' OR e.drug_name LIKE '%磺达肝癸%')) AND NOT EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_original\" o2 WHERE o2.in_hospital_serial_no = pi.in_hospital_serial_no AND (o2.advice_name LIKE '%下腔静脉滤器%' OR o2.advice_name LIKE '%滤器置入%')) THEN 1 ELSE 0 END AS dvt_only_mech"
    - "CASE WHEN EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_original\" o WHERE o.in_hospital_serial_no = pi.in_hospital_serial_no AND o.start_time < :periodEnd AND (o.end_time IS NULL OR o.end_time >= :periodStart) AND (o.advice_name LIKE '%下腔静脉滤器%' OR o.advice_name LIKE '%滤器置入%')) AND NOT EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_execute_drug\" e JOIN \"zing_icu_db_prod\".\"patient_advice_execute\" x ON x.id = e.execute_id WHERE e.patient_id = pi.id AND e.del_flag = 0 AND x.del_flag = 0 AND x.start_time < :periodEnd AND (x.end_time IS NULL OR x.end_time >= :periodStart) AND (e.drug_name LIKE '%肝素%' OR e.drug_name LIKE '%利伐沙班%' OR e.drug_name LIKE '%达比加群酯%' OR e.drug_name LIKE '%阿哌沙班%' OR e.drug_name LIKE '%磺达肝癸%')) AND NOT EXISTS (SELECT 1 FROM \"zing_icu_db_prod\".\"patient_advice_original\" o2 WHERE o2.in_hospital_serial_no = pi.in_hospital_serial_no AND (o2.advice_name LIKE '%气压治疗%' OR o2.advice_name LIKE '%肢体加压%' OR o2.advice_name LIKE '%间歇充气%' OR o2.advice_name LIKE '%加压泵%' OR o2.advice_name LIKE '%空气波%' OR o2.advice_name LIKE '%梯度压力%' OR o2.advice_name LIKE '%抗血栓%' OR o2.advice_name LIKE '%弹力袜%')) THEN 1 ELSE 0 END AS dvt_only_filter"


# ---------------------------------------------------------------------
# 导管 / 管路（fact_device）
# 数据源：patient_tube（导管置管/拔管/带出事件表，tube 模块已在用，
#         见 TubeStatsMapper：is_not_plan_extubation=1 非计划拔管；
#         is_reintubation24=1 拔管后再插管，字段名叫 24 实际口径 48h）。
# 感染例数（VAP / CRBSI / CAUTI）不以 patient_tube.is_infect 为准
# （该列当前全 0），以医生确诊录入表 patient_doc_device_infection 为准，
# 确诊时间落在 [置入, 拔除/统计截止 + 48h] 窗口内计为相关感染
# （2024版口径：使用有创呼吸机期间或停止使用 48 小时内；
#            留置血管导管期间或拔出 48 小时内）。
# 导管分类与 TubeStatsService.groupOf 白名单一致：
#   tube_CVC管 → CVC；tube_导尿管 → 导尿管；
#   tube_气管插管 / tube_气管切开套管 → 气道导管；其余 → 其他。
# ---------------------------------------------------------------------
- fact: fact_device
  domain: 导管_管路_院感
  status: ACTIVE
  source: patient_tube
  alias: pt
  patientKey: patient_id
  inHospitalNoKey: in_hospital_no
  patientNameKey: patient_name
  departKey: depart_code
  note: 导管事件（置入/拔除/非计划拔管/48h再插管/留置天数）；感染以医生确诊录入为准
  select:
    - "pt.id AS device_id"
    - "pt.patient_id AS patient_id"
    - "pt.tube_code AS tube_code"
    - "pt.tube_name AS tube_name"
    - "pt.tube_set_start_time AS insert_time"
    - "pt.tube_set_end_time AS remove_time"
    - "pt.take_source AS take_source"
    - "pt.is_not_plan_extubation AS is_not_plan_extubation"
    - "pt.is_reintubation24 AS is_reintubation24"
    # 明细默认列：patient_tube 无科室/姓名/住院号列，经患者主表关联取出
    - "(SELECT pi0.depart_code FROM \"zing_icu_db_prod\".\"patient_info\" pi0 WHERE pi0.id = pt.patient_id) AS depart_code"
    - "(SELECT pi0.name FROM \"zing_icu_db_prod\".\"patient_info\" pi0 WHERE pi0.id = pt.patient_id) AS patient_name"
    - "(SELECT pi0.in_hospital_no FROM \"zing_icu_db_prod\".\"patient_info\" pi0 WHERE pi0.id = pt.patient_id) AS in_hospital_no"
  where:
    - "pt.del_flag = 0"
    - "pt.tube_set_start_time < :periodEnd"
    - "(pt.tube_set_end_time IS NULL OR pt.tube_set_end_time >= :periodStart)"
  derive:
    # 导管分类（三管白名单，与导管统计页一致；tube_code 形如 tube_CVC管）
    - "CASE WHEN pt.tube_code LIKE '%CVC%' OR pt.tube_code LIKE '%中心静脉%' OR pt.tube_name LIKE '%中心静脉%' OR pt.tube_name LIKE '%PICC%' THEN 'CVC' WHEN pt.tube_code LIKE '%气管插管%' OR pt.tube_code LIKE '%气管切开%' OR pt.tube_name LIKE '%气管%' THEN '气道导管' WHEN pt.tube_code LIKE '%导尿%' OR pt.tube_name LIKE '%导尿%' THEN '导尿管' ELSE '其他' END AS device_kind"
    # 本周期内拔管
    - "CASE WHEN pt.tube_set_end_time IS NOT NULL AND pt.tube_set_end_time >= :periodStart AND pt.tube_set_end_time < :periodEnd THEN 1 ELSE 0 END AS removed_in_period"
    # 非计划拔管（ICU-12 分子）
    - "CASE WHEN pt.tube_set_end_time IS NOT NULL AND pt.tube_set_end_time >= :periodStart AND pt.tube_set_end_time < :periodEnd AND pt.is_not_plan_extubation = 1 THEN 1 ELSE 0 END AS unplanned_removal"
    # 计划拔管后 48h 内再插管（ICU-13 分子；2024版口径：再插管率不含非计划拔管后再插管，
    # 源字段无法区分再插管是否继发于非计划拔管，按 is_reintubation24 且排除非计划拔管行近似）
    - "CASE WHEN pt.tube_set_end_time IS NOT NULL AND pt.tube_set_end_time >= :periodStart AND pt.tube_set_end_time < :periodEnd AND pt.is_not_plan_extubation = 0 AND pt.is_reintubation24 = 1 THEN 1 ELSE 0 END AS reintubation_48h"
    # 留置天数：本周期 ∩ 留置区间；未拔管的截止到转出带管时间，再退到本周期末
    - "DATEDIFF(DAY, CASE WHEN pt.tube_set_start_time < :periodStart THEN :periodStart ELSE pt.tube_set_start_time END, CASE WHEN pt.tube_set_end_time IS NOT NULL AND pt.tube_set_end_time < :periodEnd THEN pt.tube_set_end_time WHEN pt.tube_take_away_time IS NOT NULL AND pt.tube_take_away_time < :periodEnd THEN pt.tube_take_away_time ELSE :periodEnd END) AS device_days"
    # 相关感染：按导管类型匹配确诊记录（VAP→气道导管 / CRBSI→CVC / CAUTI→导尿管），
    # 确诊时间须在置入之后、且不晚于拔除/统计截止 +48h。
    # 分类表达式在内联时重复三次（同一 SELECT 内不能引用输出别名）。
    - "CASE WHEN (pt.tube_code LIKE '%CVC%' OR pt.tube_code LIKE '%中心静脉%' OR pt.tube_name LIKE '%中心静脉%' OR pt.tube_name LIKE '%PICC%') AND EXISTS (SELECT 1 FROM \"zing_doctor_db_prod\".\"patient_doc_device_infection\" r WHERE r.patient_id = pt.patient_id AND r.status = 1 AND r.infection_type = 'CRBSI' AND r.confirm_time >= pt.tube_set_start_time AND r.confirm_time <= :periodEnd AND (pt.tube_set_end_time IS NULL OR DATEDIFF(HOUR, pt.tube_set_end_time, r.confirm_time) BETWEEN 0 AND 48)) THEN 1 WHEN (pt.tube_code LIKE '%气管插管%' OR pt.tube_code LIKE '%气管切开%' OR pt.tube_name LIKE '%气管%') AND EXISTS (SELECT 1 FROM \"zing_doctor_db_prod\".\"patient_doc_device_infection\" r WHERE r.patient_id = pt.patient_id AND r.status = 1 AND r.infection_type = 'VAP' AND r.confirm_time >= pt.tube_set_start_time AND r.confirm_time <= :periodEnd AND (pt.tube_set_end_time IS NULL OR DATEDIFF(HOUR, pt.tube_set_end_time, r.confirm_time) BETWEEN 0 AND 48)) THEN 1 WHEN (pt.tube_code LIKE '%导尿%' OR pt.tube_name LIKE '%导尿%') AND EXISTS (SELECT 1 FROM \"zing_doctor_db_prod\".\"patient_doc_device_infection\" r WHERE r.patient_id = pt.patient_id AND r.status = 1 AND r.infection_type = 'CAUTI' AND r.confirm_time >= pt.tube_set_start_time AND r.confirm_time <= :periodEnd AND (pt.tube_set_end_time IS NULL OR DATEDIFF(HOUR, pt.tube_set_end_time, r.confirm_time) BETWEEN 0 AND 48)) THEN 1 ELSE 0 END AS device_infection"

