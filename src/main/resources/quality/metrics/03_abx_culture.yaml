# =====================================================================
# 指标层 · 抗菌药送检（8 条）
#
# 事实层已把「首次抗菌药时间」与「首次各类送检时间」算成列，
# 因此「送检早于用药」这条核心口径在这里只写一次比较表达式。
#
# 「治疗性抗菌药物」系列（quality_427~432）官方口径
# （《重症医学专业医疗质量控制指标（2024 年版）》ICU-06）：
#   以治疗为目的使用抗菌药物 = 用药目的为「治疗」的全身给药
#   （口服、皮下注射、肌内注射、静脉滴注、静脉注射）；
#   病原学检验项目 = 微生物培养及药敏、显微镜检查、免疫学检测、分子快速诊断、
#   相关标志物检验（**不包括降钙素原 PCT、白介素-6**；2015 版曾包含 PCT/IL-6，
#   2024 版起剔除 —— 版本差异是这两条历史分歧的根源）。
#   因此：G/GM 试验（1,3-β-D-葡聚糖/半乳甘露聚糖，属免疫学检测）计入分子；
#         PCT（quality_429）、白介素（quality_432）按 2024 版不计入送检率分子，
#         仅作扩展监测项。
# 落地前置条件：需连库确认 patient_advice 是否有「用药目的」字段
# （治疗/预防/诊断）。无该字段时无法区分治疗性与预防性用药，
# 按全部抗菌药出数会系统性低估分母/高估分子，故维持 PLACEHOLDER 不出假数。
# =====================================================================

- {code: quality_12,  name: "使用抗菌药物前病原学检验标本送检", domain: 抗菌药送检, fact: fact_abx_culture, unit: "%", valueType: RATE, scale: 100, where: "abx_used = 1 AND culture_first_time IS NOT NULL AND culture_first_time <= abx_first_time", denominatorWhere: "abx_used = 1", dims: [depart_code], version: 1, sortNo: 6, remark: "分母=使用抗菌药物患者；分子=首次培养/涂片/镜检/药敏/鉴定送检时间不晚于首剂抗菌药时间。老脚本越界取值（把全院送检算进分子），此处按患者维度修正"}
- {code: quality_13,  name: "使用抗菌药物治疗", domain: 抗菌药送检, fact: fact_abx_culture, unit: "人", valueType: COUNT, where: "abx_used = 1", dims: [depart_code], version: 1, sortNo: 7, remark: "quality_12 的分母，单独出数便于核对"}
- {code: quality_427, name: "治疗性抗菌药物使用前送检病原学标本例数", domain: 抗菌药送检, fact: fact_abx_culture, unit: "人", valueType: COUNT, implStatus: PLACEHOLDER, version: 1, sortNo: 64, remark: "空壳：口径待定 —— 缺「治疗性 / 预防性」用药标识。老系统同样为空壳，不给出假 0"}
- {code: quality_428, name: "使用治疗性抗菌药物例数", domain: 抗菌药送检, fact: fact_abx_culture, unit: "人", valueType: COUNT, implStatus: PLACEHOLDER, version: 1, sortNo: 65, remark: "空壳：口径待定 —— 同上缺治疗性标识"}
- {code: quality_429, name: "治疗性抗菌药物使用前送检PCT例数", domain: 抗菌药送检, fact: fact_abx_culture, unit: "人", valueType: COUNT, implStatus: PLACEHOLDER, version: 1, sortNo: 66, remark: "空壳：口径待定 —— 与 quality_427 同因（缺「治疗性 / 预防性」用药标识）。若按全部抗菌药出数会系统性低估，故不出数；PCT 首检时间已在事实层备好，接入标识后补一条 where 即可启用"}
- {code: quality_430, name: "使用治疗性抗菌药物例数", domain: 抗菌药送检, fact: fact_abx_culture, unit: "人", valueType: COUNT, implStatus: PLACEHOLDER, version: 1, sortNo: 67, remark: "空壳：与 quality_428 重复，来源清单要求保留三条，此处保留占位"}
- {code: quality_431, name: "治疗性抗菌药物使用前送检G/GM实验例数", domain: 抗菌药送检, fact: fact_abx_culture, unit: "人", valueType: COUNT, implStatus: PLACEHOLDER, version: 1, sortNo: 68, remark: "空壳：口径待定 —— 同 quality_427。另指标名有误（应为 G 试验 / GM 试验），名称沿用来源清单以免对不上账"}
- {code: quality_432, name: "治疗性抗菌药物使用前送检白介素例数", domain: 抗菌药送检, fact: fact_abx_culture, unit: "人", valueType: COUNT, implStatus: PLACEHOLDER, version: 1, sortNo: 69, remark: "空壳：口径待定 —— 同 quality_427（白介素按 IL-6 识别的词表已在事实层备好）"}
