# =====================================================================
# 指标层 · DVT 预防（11 条）
#
# 数据源：fact_dvt（ACTIVE）。诊断侧 = patient_info_diagnosis 关键词 + 转归；
# 预防侧 = 医嘱（药物 patient_advice_execute_drug / 机械与滤器 patient_advice_original），
# 关键词按《重症医学专业医疗质量控制指标（2024 年版）》ICU-07 官方口径：
#   药物预防 = 肝素或低分子肝素等抗凝药物（依诺肝素、那曲肝素、利伐沙班等口服抗凝剂）；
#   机械预防 = 肢体加压泵、梯度压力弹力袜等；另有下腔静脉滤器。
# 业务指标「DVT 预防率」由规则层配置（quality_14 ÷ quality_0 × 100，
# 见 sql/51_quality_rule_local_gap.sql），本层只出原子项。
# =====================================================================

- {code: quality_14,  name: "进行深静脉血栓预防的患者数", domain: DVT预防, fact: fact_dvt, unit: "人", valueType: COUNT, where: "dvt_prevent_status = 1", dims: [depart_code], version: 2, sortNo: 8,  remark: "任一预防措施（药物/机械/滤器）即计入；2024版ICU-07口径，源为医嘱侧"}
