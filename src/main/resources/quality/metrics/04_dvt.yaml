- {code: quality_408, name: "仅进行下腔静脉滤器置入的患者数", domain: DVT预防, fact: fact_dvt, unit: "人", valueType: COUNT, where: "dvt_only_filter = 1", dims: [depart_code], version: 2, sortNo: 45, remark: "仅滤器（未做药物/机械预防）"}
