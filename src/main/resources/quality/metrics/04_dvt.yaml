- {code: quality_405, name: "进行深静脉血栓药物预防的患者总数", domain: DVT预防, fact: fact_dvt, unit: "人", valueType: COUNT, where: "dvt_drug_status = 1", dims: [depart_code], version: 2, sortNo: 42, remark: "含合并其他预防措施者"}
