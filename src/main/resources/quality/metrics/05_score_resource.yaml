# =====================================================================
# 指标层 · 评分与资源（7 条）
#
# 预计病死率是 AVG 类：事实层出「mortality_rate 求和」与「有评分的患者计数」，
# 值 = 和 / 计数。这样 1-12 月与季度/全年都按 sum(分子)/sum(分母) 汇总，
# 不会出现「把 12 个月的率再平均一次」的老问题。
# =====================================================================

- {code: quality_15,  name: "ICU收治患者预计病死率(%)", domain: 评分_资源, fact: fact_score_resource, unit: "%", valueType: AVG, agg: SUM, numerator: "mortality_rate", denominatorWhere: "mortality_rate IS NOT NULL", dims: [depart_code], version: 1, sortNo: 9,  remark: "复用 APACHE II 评分记录，取 mortality_rate 均值；分母为「有评分的患者数」而非全部收治患者"}
