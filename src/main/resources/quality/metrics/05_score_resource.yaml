# =====================================================================
# 指标层 · 评分与资源（7 条）
#
# 病死率类要分清两层，混在一起就是数量级错误：
#   quality_15 = mortality_rate 求和（各患者预计死亡率的「和」，不是率本身）；
#   真正的「预计病死率」是 ICU 侧规则：quality_15 ÷ 同期人数 × 系数。
# 因此 quality_15 这一层**不能**先除一遍求均值 —— 否则规则再除一次，
# 等于除了两遍，值会小到离谱（这正是此前口径存疑的由来，已与 ICU 侧确认）。
# 用 SUM 而非 AVG 的另一个好处：月度与季度都按 sum(分子)/sum(分母) 汇总，
# 不会出现「把 12 个月的率再平均一次」的老问题。
# =====================================================================

- {code: quality_15,  name: "ICU收治患者预计病死率之和(%)", domain: 评分_资源, fact: fact_score_resource, unit: "%", valueType: SUM, agg: SUM, numerator: "mortality_rate", denominatorWhere: "mortality_rate IS NOT NULL", dims: [depart_code], version: 2, sortNo: 9,  remark: "APACHE II 评分记录 mortality_rate 求和（各患者预计死亡率之和，非均值）；ICU 侧规则以它为分子再除以人数得出预计病死率，故此处不除"}
