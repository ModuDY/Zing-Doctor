# =====================================================================
# zing-doctor 部署配置（安装脚本 install-mariadb-debian.sh 读取本文件）
#
# 改这里就能告诉安装脚本「连哪台服务器的库」，无需再敲一长串环境变量：
#   ./install-mariadb-debian.sh                 完整安装/升级（读本文件）
#   ./install-mariadb-debian.sh --config-only   只按本文件重写运行环境并重启后端
#                                               （不动数据库、不导 SQL、不更新前端）
#   DB_CONF=/path/to/other.conf ./install-...   用别的配置文件
#
# 优先级：命令行/环境变量  >  本文件  >  脚本内置默认值
#         例：DB_HOST=10.0.0.9 ./install-mariadb-debian.sh 会覆盖本文件的 DB_HOST
#
# 语法：KEY=VALUE 一行一个；整行或「空白 + #」之后是注释；值两端引号可省。
#       ICU_DB_HOST 留空表示与主库同实例。
# =====================================================================

# ---------------------------------------------------------------
# 一、主库（本系统自己的库：zing_doctor_db_prod）
#   同机 Docker 映射端口 -> 127.0.0.1 + 映射端口（如 23306）
#   库在另一台服务器    -> 填对方 IP + 真实端口（如 3306）
# ---------------------------------------------------------------
DB_HOST=127.0.0.1
DB_PORT=23306

# ---------------------------------------------------------------
# 二、ICU 只读库（读患者/医嘱/检验等数据）
#   留空 = 与主库同一实例；库在另一台服务器则填对方 IP/端口
#   注意：库名在程序里固定为 zing_icu_db_prod（JDBC URL 与跨库查询都写死了），
#        换了服务器也要确认对方有同名库，且账号有 SELECT
# ---------------------------------------------------------------
ICU_DB_HOST=
ICU_DB_PORT=

# ---------------------------------------------------------------
# 三、管理员账号（仅安装脚本建库/建表/授权时使用）
#   本机自建（root 走 unix_socket 免密）：两行都留空即可
#   远程库 / 容器库：填有建库与授权权限的账号
# ---------------------------------------------------------------
DB_ADMIN_USER=root
DB_ADMIN_PASSWORD=

# ---------------------------------------------------------------
# 四、应用账号（应用连库用的账号；脚本会创建并授权，已存在则改密码）
#   主库需要 ALL，ICU 库需要 SELECT
# ---------------------------------------------------------------
APP_DB_USER=zing
APP_DB_PASSWORD=Zing@2026

# ---------------------------------------------------------------
# 五、ICU 库专用账号（可选）
#   ICU 由厂方提供只读账号时填这里；留空则复用上面的应用账号
# ---------------------------------------------------------------
ICU_DB_USER=
ICU_DB_PASSWORD=

# ---------------------------------------------------------------
# 六、数据库客户端（可选，宿主机没装 mysql/mariadb 客户端时用）
#   例：库在本机 Docker 里
#     DB_CLI=docker exec -i zing-mysql mysql -uroot -pzing@123
#   例：本机无客户端，借已有镜像连远程库
#     DB_CLI=docker run --rm -i zing-mysql:10.5.6.1 mysql -h199.199.5.151 -P3306 -uroot -pzing@123
#   留空则自动在 PATH 里找 mariadb/mysql
# ---------------------------------------------------------------
DB_CLI=

# ---------------------------------------------------------------
# 七、离线部署开关（医院内网无外网、apt 源不可达时）
#   留空 = 自动：缺少组件时尝试 apt（干净 Debian 全自动装库用这种）
#   yes  = 完全不调用 apt，直接用系统已装组件（离线服务器填这个）
# ---------------------------------------------------------------
SKIP_APT=

# 手动指定可执行文件（自动探测不到时用）
JAVA_BIN=
NGINX_BIN=

# ---------------------------------------------------------------
# 八、端口与业务开关
# ---------------------------------------------------------------
WEB_PORT=2001
BACKEND_PORT=8081

# ICU 数据来源：sql=连真实 ICU 库；mock=内置示例数据（不依赖 ICU 库，演示用）
ICU_DATA_PROVIDER=sql

# 是否给 ICU 库加性能索引（对医院生产库有变更，默认 no；需 DBA 知情）
SETUP_ICU_INDEX=no

# 前端托管方式：auto=自动（宿主 nginx 优先，其次 nginx 容器）/ nginx / docker / none
WEB_MODE=auto
# 容器方式使用的镜像，留空则优先复用本机已有 nginx 镜像
NGINX_IMAGE=

# ---------------------------------------------------------------
# 九、外链与安全（生产建议覆盖，尤其是外发院方时）
# ---------------------------------------------------------------
ICU_LINK_TOKEN=zing-icu-link-token-2026
EXTERNAL_LINK_SECRET=zing-doctor-prod-secret-change-me
# 医生决策系统对外基础地址（含端口），外链 302 跳转用；留空用相对路径
EXTERNAL_LINK_BASE_URL=
# 质控配置写接口 IP 白名单（逗号分隔，留空不限制）
QUALITY_CONFIG_WRITE_IP_WHITELIST=
